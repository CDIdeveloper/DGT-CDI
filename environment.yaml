name: dgt
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.16
  - mamba
  - graph-tool=2.45
  - pip
  - pip:
      - torch==2.1.0
      - torchvision==0.16.0
      - torchaudio==2.1.0
      - --find-links https://data.pyg.org/whl/torch-2.1.0+cu121.html
      - pyg_lib
      - torch_scatter
      - torch_sparse
      - torch_cluster
      - torch_spline_conv
      - torch-geometric==2.0.4
      - torchmetrics==1.2.0
      - ogb==1.3.6
      - tensorboardX==2.6.2.2
      - wandb==0.18.7
      - rdkit==2025.9.1
      - libauc==1.1.0
