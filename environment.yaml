# installation: mamba env create -f environment.yaml
name: dgt

channels:
  - conda-forge

dependencies:
  - python=3.10.16
  - graph-tool=2.45
  - pytest=8.0.1
  - pip

  - pip:
      # PyTorch 2.1.0 with CUDA 12.1 wheels
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.1.0
      - torchvision==0.16.0
      - torchaudio==2.1.0

      # PyTorch Geometric compiled extensions for torch 2.1.0 + CUDA 12.1
      - --find-links https://data.pyg.org/whl/torch-2.1.0+cu121.html
      - pyg_lib
      - torch_scatter
      - torch_sparse
      - torch_cluster
      - torch_spline_conv

      # Other Python packages
      - torch-geometric==2.0.4
      - yacs==0.1.8           # required by GraphGym for the global cfg object
      - torchmetrics==1.2.0
      - ogb==1.3.6
      - tensorboardX==2.6.2.2
      - wandb==0.18.7
      - rdkit==2025.9.1
      - libauc==1.1.0

      # Post-hoc analysis (scripts/analyze_run.py)
      - matplotlib==3.8.4
      - scikit-learn==1.4.2
