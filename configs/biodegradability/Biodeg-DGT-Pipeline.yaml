# Baseline config for the biodeg dataset (no-Reaxys variant).
#
# Sibling of Biodeg-GWU-DGT-Pipeline.yaml: identical architecture and
# hyperparameters; only dataset routing changes.
#
# Three substantive differences from the biodeg_gwu config:
#   - dataset.format: PyG-biodeg → routes to graphgps/loader/dataset/biodeg.py
#   - dataset.name:   biodeg     (matches the trans_learn DATASET_REGISTRY key)
#   - wandb.project:  Biodeg     (logically distinct W&B workspace)
#
# Class balance — to be verified once you run the dataset-level smoke test
# (load via `Biodeg('datasets/biodeg')` and inspect splits). If positive
# fraction falls outside roughly 30-70 %, consider switching loss_fun to
# `weighted_cross_entropy` or `focal_loss` (Phase 3 note in overview.md).
# For now, plain cross_entropy mirrors the biodeg_gwu baseline.

out_dir: results/DGT
metric_best: auc
metric_agg: argmax   # AUC: higher is better → argmax
wandb:
  use: False
  project: Biodeg
dataset:
  format: PyG-biodeg
  name: biodeg
  task: graph
  task_type: classification_binary
  transductive: False
  split_mode: standard   # consume the train/val/test_graph_index set by the loader
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_shared: True
  edge_encoder_name: LinearEdge+RWSE-SPDE
  edge_encoder_num_types: 3
  edge_encoder_bn: False
  spd: True
  spd_max_length: 8
  rings: True
  rings_max_length: 18
  rings_coalesce_edges: False
share:
  dim_in: 9
posenc_RWSE:
  enable: True
  enable_edges: True
  kernel:
    times_func: range(1,17)
  model: Linear
  dim_pe: 64
  raw_norm_type: None
train:
  mode: dgt              # DGT pipeline (train+val each epoch; test once on best ckpt)
  batch_size: 16         # 32 OOMs on a 14.6 GiB T4: biodeg has larger molecules than
                         # biodeg_gwu, so a batch's bond-bond tensor [B, M_max^2, D] in
                         # the line-graph attention path overflows. See tech.md.
  eval_period: 1
  enable_ckpt: True
  ckpt_best: True
  ckpt_clean: True
model:
  type: DGTModel
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: add
gt:
  layer_type: None+DGT
  layers: 4
  n_heads: 16
  dim_hidden: 128  # must equal gnn.dim_inner
  dropout: 0.0
  attn_dropout: 0.3
  layer_norm: False
  batch_norm: True
gnn:
  head: line_graph       # baseline: NO descriptor fusion. Phase 2 adds line_graph_with_desc.
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 128  # must equal gt.dim_hidden
  batchnorm: True
  act: gelu
  dropout: 0.0
  agg: mean
  normalize_adj: False
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-2
  base_lr: 0.0004
  max_epoch: 50
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
