# Phase-1 baseline config for biodeg_gwu (GWU batch-2 biodegradability).
#
# Mirrors BBBP-DGT-Pipeline.yaml architecture (similar task: binary classif.
# on small organics) with three substantive changes:
#   - dataset.format / name → routes to graphgps/loader/dataset/biodeg_gwu.py
#   - dataset.split_mode: standard → consumes pre-set *_graph_index lists
#     emitted by preformat_BiodegGwu (the BBBP config uses scaffold split)
#   - gnn.head: line_graph (NO descriptor fusion) — Phase 2 will add
#     `line_graph_with_desc`. This baseline gives a no-descriptor reference
#     point for the Phase 4 ablation.
#
# Class balance from Phase 1 smoke test: train 43.1% / val 41.8% / test 48.0%
# positive → plain `cross_entropy` is correct (no weighted / focal needed).

out_dir: results/DGT
metric_best: auc
metric_agg: argmax   # AUC: higher is better → argmax
wandb:
  use: False
  project: BiodegGwu
dataset:
  format: PyG-biodeg_gwu
  name: biodeg_gwu
  task: graph
  task_type: classification_binary
  transductive: False
  split_mode: standard   # consume the train/val/test_graph_index set by the loader
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_shared: True
  edge_encoder_name: LinearEdge+RWSE-SPDE
  edge_encoder_num_types: 3
  edge_encoder_bn: False
  spd: True
  spd_max_length: 8
  rings: True
  rings_max_length: 18
  rings_coalesce_edges: False
share:
  dim_in: 9
posenc_RWSE:
  enable: True
  enable_edges: True
  kernel:
    times_func: range(1,17)
  model: Linear
  dim_pe: 64
  raw_norm_type: None
train:
  mode: dgt              # DGT pipeline (train+val each epoch; test once on best ckpt)
  batch_size: 32
  eval_period: 1
  enable_ckpt: True
  ckpt_best: True
  ckpt_clean: True
model:
  type: DGTModel
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: add
gt:
  layer_type: None+DGT
  layers: 4
  n_heads: 16
  dim_hidden: 128  # must equal gnn.dim_inner
  dropout: 0.0
  attn_dropout: 0.3
  layer_norm: False
  batch_norm: True
gnn:
  head: line_graph       # baseline: NO descriptor fusion. Phase 2 adds line_graph_with_desc.
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 128  # must equal gt.dim_hidden
  batchnorm: True
  act: gelu
  dropout: 0.0
  agg: mean
  normalize_adj: False
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-2
  base_lr: 0.0004
  max_epoch: 50
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
