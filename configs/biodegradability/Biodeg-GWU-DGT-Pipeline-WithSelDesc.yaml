# Descriptor-fusion config for biodeg_gwu (GWU batch-2), ALL descriptors.
#
# Phase-2 sibling of Biodeg-GWU-DGT-Pipeline.yaml (the no-descriptor baseline).
# Identical backbone/optimizer; only the descriptor channel differs:
#   - gnn.head: line_graph_with_desc  (was: line_graph)
#   - gnn.desc_proj_dim: 128          — output of f(desc); tune to modulate impact
#   - dataset.desc_dim: 247           — all GWU descriptors (Phase-1 smoke test)
#   - dataset.standardize_desc: True  — z-score (train-split stats); separate
#                                       cache data_stdesc.pt (baseline untouched)
#
# This is "variant 2 — all descriptors" of the GWU descriptor-type study
# (documents/projects/gwu.md). batch_size 32 (GWU fits at 32; desc head adds
# negligible memory).

out_dir: results/DGT
metric_best: auc
metric_agg: argmax
wandb:
  use: False
  project: BiodegGwu-WithDesc
dataset:
  format: PyG-biodeg_gwu
  name: biodeg_gwu
  task: graph
  task_type: classification_binary
  transductive: False
  split_mode: standard
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_shared: True
  edge_encoder_name: LinearEdge+RWSE-SPDE
  edge_encoder_num_types: 3
  edge_encoder_bn: False
  spd: True
  spd_max_length: 8
  rings: True
  rings_max_length: 18
  rings_coalesce_edges: False
  desc_dim: 94             # len(desc_columns) selected descriptors printed scripts/select_features_from_shap.py
  standardize_desc: True
  desc_columns: ['BertzCT_rdkit', 'weakly_polar_surface_area_gwu', 'RingCount_rdkit', 'VSA_EState8_rdkit', 'Chi4v_rdkit', 'min_atom_charge_gwu', 'SlogP_VSA10_rdkit', 'fr_C_O_rdkit', 'band_gap_gwu', 'MaxAbsEStateIndex_rdkit', 'fr_halogen_rdkit', 'fr_unbrch_alkane_rdkit', 'fr_NH0_rdkit', 'SlogP_VSA1_rdkit', 'IP_eV_gwu', 'SMR_VSA10_rdkit', 'PEOE_VSA8_rdkit', 'SPS_rdkit', 'Chi2v_rdkit', 'Kappa2_rdkit', 'AvgIpc_rdkit', 'SlogP_VSA4_rdkit', 'PEOE_VSA9_rdkit', 'max_atom_charge_gwu', 'VSA_EState4_rdkit', 'Chi4n_rdkit', 'dipole_gwu', 'qed_rdkit', 'VSA_EState7_rdkit', 'EState_VSA8_rdkit', 'hydrophilic_surface_area_gwu', 'Kappa3_rdkit', 'globularity_gwu', 'EA_eV_gwu', 'NumHeteroatoms_rdkit', 'BalabanJ_rdkit', 'VSA_EState10_rdkit', 'MinPartialCharge_rdkit', 'EState_VSA3_rdkit', 'SMR_VSA3_rdkit', 'EState_VSA5_rdkit', 'MinAbsEStateIndex_rdkit', 'VSA_EState5_rdkit', 'molecular_weight_g_mol_gwu', 'fr_Ar_N_rdkit', 'PEOE_VSA4_rdkit', 'EState_VSA4_rdkit', 'chemical_potential_gwu', 'MaxAbsPartialCharge_rdkit', 'SlogP_VSA5_rdkit', 'Chi3v_rdkit', 'VSA_EState1_rdkit', 'PEOE_VSA5_rdkit', 'Chi0v_rdkit', 'hbond_donor_gwu', 'PEOE_VSA10_rdkit', 'aromatic_surface_area_gwu', 'PEOE_VSA2_rdkit', 'lj_interaction_energy_propane_gwu', 'water_gas_partition_gwu', 'cohesive_interactions_solids_gwu', 'SMR_VSA6_rdkit', 'EState_VSA6_rdkit', 'PEOE_VSA7_rdkit', 'SMR_VSA5_rdkit', 'polarity_gwu', 'fr_allylic_oxid_rdkit', 'hbond_acceptor_gwu', 'NumHDonors_rdkit', 'aqueous_solubility_gwu', 'fr_ester_rdkit', 'SlogP_VSA3_rdkit', 'FpDensityMorgan1_rdkit', 'FpDensityMorgan3_rdkit', 'lj_interaction_energy_water_gwu', 'fr_piperdine_rdkit', 'EState_VSA10_rdkit', 'VSA_EState3_rdkit', 'surface_area_gwu', 'hexadecane_gas_partition_gwu', 'SlogP_VSA7_rdkit', 'electrophilic_index_gwu', 'PEOE_VSA3_rdkit', 'octanol_water_partition_gwu', 'SlogP_VSA2_rdkit', 'coulomb_interaction_energy_water_gwu', 'hydrophobic_surface_area_gwu', 'FractionCSP3_rdkit', 'EState_VSA2_rdkit', 'MinEStateIndex_rdkit', 'Kappa1_rdkit', 'MolMR_rdkit', 'SMR_VSA1_rdkit', 'HallKierAlpha_rdkit']
share:
  dim_in: 9
posenc_RWSE:
  enable: True
  enable_edges: True
  kernel:
    times_func: range(1,17)
  model: Linear
  dim_pe: 64
  raw_norm_type: None
train:
  mode: dgt
  batch_size: 32
  eval_period: 1
  enable_ckpt: True
  ckpt_best: True
  ckpt_clean: True
model:
  type: DGTModel
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: add
gt:
  layer_type: None+DGT
  layers: 4
  n_heads: 16
  dim_hidden: 128  # must equal gnn.dim_inner
  dropout: 0.0
  attn_dropout: 0.3
  layer_norm: False
  batch_norm: True
gnn:
  head: line_graph_with_desc
  desc_proj_dim: 128
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 128  # must equal gt.dim_hidden
  batchnorm: True
  act: gelu
  dropout: 0.0
  agg: mean
  normalize_adj: False
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-2
  base_lr: 0.0004
  max_epoch: 50
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
